<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1420" viewBox="0 0 1060 1420"><title>JitRL Router end-to-end decision path (arm C)</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect x="0" y="0" width="1060" height="1420" fill="#ffffff"/><text x="24" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="bold">JitRL Router — End-to-End Decision Path (Arm C)</text><text x="24" y="54" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="start" fill="#475569" font-weight="normal">frozen local judge · non-parametric memory · closed-form logit update</text><rect x="90" y="92" width="520" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="106" y="118" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">User message</text><text x="106" y="137" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">raw conversation turn (Chinese/English)</text><rect x="90" y="196" width="520" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="106" y="222" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">State extraction</text><text x="106" y="241" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">intent_class · rule-normalized task signature · CJK bigrams</text><line x1="350.0" y1="166" x2="350.0" y2="193" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><rect x="90" y="300" width="520" height="72" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="106" y="326" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">Local Judge — frozen, no weight updates</text><text x="106" y="345" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">MiniCPM5-1B Q4_K_M via llama.cpp (:18080)</text><text x="106" y="360" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">Method B: 4 grammar-forced requests → 4-tier base logits z</text><text x="598" y="326" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="end" fill="#0369a1" font-weight="bold">≈ 1–3 s</text><line x1="350.0" y1="270" x2="350.0" y2="297" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><rect x="90" y="404" width="520" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="106" y="430" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">Memory retrieval</text><text x="106" y="449" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">same intent_class · token-set Jaccard ≥ 0.5 · top-k = 10</text><text x="106" y="464" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">entries {intent, signature, tier, G}</text><line x1="350.0" y1="374" x2="350.0" y2="401" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><rect x="90" y="508" width="520" height="72" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="106" y="534" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">Value estimation</text><text x="106" y="553" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">V = mean G · Q(tier) from neighbors · λ-exploration bonus</text><text x="106" y="568" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">normalized advantage Â per tier</text><line x1="350.0" y1="478" x2="350.0" y2="505" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><rect x="90" y="612" width="520" height="72" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/><text x="106" y="638" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">Min-neighbor gate</text><text x="106" y="657" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">C0: min_neighbors = 1 · C1: min_neighbors = 3</text><text x="106" y="672" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">n_retrieved &lt; min → pass-through (z' = z)</text><line x1="350.0" y1="582" x2="350.0" y2="609" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><rect x="90" y="716" width="520" height="72" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="106" y="742" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">Closed-form logit update</text><text x="106" y="761" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">z'(tier) = z(tier) + β·Â(tier) · β = 5 · clamp z_min = −10</text><text x="598" y="742" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="end" fill="#15803d" font-weight="bold">mean 0.24 ms / max 0.67 ms</text><line x1="350.0" y1="686" x2="350.0" y2="713" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><rect x="90" y="820" width="520" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="106" y="846" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">Tier decision</text><text x="106" y="865" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">argmax(z') over simple / medium / complex / reasoning</text><line x1="350.0" y1="790" x2="350.0" y2="817" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><rect x="90" y="924" width="520" height="72" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="106" y="950" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">Tier → model static map</text><text x="106" y="969" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">simple → CPA/glm-5.3-flash · medium → CPA/opencode-v4-flash</text><text x="106" y="984" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">complex → CPA/OpenBMB-5.3 · reasoning → CPA/glm-5.3</text><line x1="350.0" y1="894" x2="350.0" y2="921" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><rect x="90" y="1028" width="520" height="72" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="106" y="1054" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">Execution</text><text x="106" y="1073" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">CPA completion · 1024-token budget · temperature 0.7</text><line x1="350.0" y1="998" x2="350.0" y2="1025" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><rect x="90" y="1132" width="520" height="72" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="106" y="1158" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">Blind Evaluator</text><text x="106" y="1177" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">CPA/gpt-5.6-sol · structured JSON · not in the tier map</text><line x1="350.0" y1="1102" x2="350.0" y2="1129" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><rect x="90" y="1328" width="520" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="106" y="1354" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">Reward</text><text x="106" y="1373" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">r = 0.6·quality + 0.3·cost_saving  (denominator: glm-5.3)</text><line x1="350.0" y1="1206" x2="350.0" y2="1325" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><rect x="700" y="396" width="330" height="1012" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="7 5"/><text x="718" y="426" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#7c3aed" font-weight="bold">Experience memory (non-parametric)</text><text x="718" y="450" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">stores (state, tier, reward-G) triples</text><text x="718" y="470" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" 