<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640"><title>PilotDeck upstream integration points (future work)</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect x="0" y="0" width="1180" height="640" fill="#ffffff"/><text x="24" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="bold">PilotDeck Upstream Integration — future work</text><text x="24" y="54" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="start" fill="#475569" font-weight="normal">harness replicates the Router decision path today; upstream PR is out of the 22h budget</text><rect x="1010" y="26" width="96" height="24" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="1058" y="42" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="bold">FUTURE WORK</text><rect x="24" y="96" width="500" height="470" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="44" y="128" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" text-anchor="start" fill="#0f172a" font-weight="bold">PilotDeck Router runtime (today)</text><rect x="44" y="150" width="460" height="84" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/><text x="60" y="178" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">RouterRuntime</text><text x="60" y="198" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">invalidateSticky() at every user turn</text><text x="60" y="213" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">sticky covers only the intra-turn tool loop</text><rect x="44" y="256" width="460" height="84" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/><text x="60" y="284" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">generateJudgePrompt</text><text x="60" y="304" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">4-tier prompt · previousTier as TEXT hint</text><text x="60" y="319" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">no outcome / cost / quality feedback flows back</text><rect x="44" y="362" width="460" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/><text x="60" y="390" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">Judge LLM → tier → model</text><text x="60" y="410" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">cross-turn experience vacuum:</text><text x="60" y="425" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">the judge re-decides each turn from scratch</text><text x="44" y="486" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" text-anchor="start" fill="#64748b" font-weight="bold">⇒ between turns the router re-makes similar mistakes</text><rect x="560" y="96" width="596" height="470" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/><text x="580" y="128" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" text-anchor="start" fill="#15803d" font-weight="bold">JitRL integration via extension points</text><rect x="580" y="150" width="556" height="96" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.4"/><text x="596" y="178" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">① CustomRouter.decide()</text><text x="596" y="198" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">already-pluggable: may return provider/model and fully take over routing</text><text x="596" y="213" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">⇒ hosts the JitRL engine with ZERO Router-core changes</text><rect x="580" y="262" width="556" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="596" y="290" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" text-anchor="start" fill="#dc2626" font-weight="bold">② logprob passthrough (missing upstream)</text><text x="596" y="310" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">the judge LLM call must expose per-tier logits</text><text x="596" y="325" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">today PilotDeck only surfaces the chosen tier</text><rect x="580" y="374" width="556" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="596" y="402" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" text-anchor="start" fill="#dc2626" font-weight="bold">③ episode outcome callback (missing upstream)</text><text x="596" y="422" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">quality / cost after the episode → engine.learn()</text><text x="596" y="437" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">feeds the (state, tier, reward) memory</text><rect x="580" y="486" width="556" height="60" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.2" stroke-dasharray="6 4"/><text x="596" y="510" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">meanwhile: this repo's independent Python harness replicates the</text><text x="596" y="525" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="start" fill="#475569" font-weight="normal">Router decision path (same prompt format · 4 tiers · previousTier rules)</text><line x1="524" y1="330" x2="557" y2="330" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="542.0" y="318" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="normal">extend</text></svg>